[package]
name = "pre-build"
description = "Functions to run before running build of the front-end apps"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { workspace = true }
clap = { version = "4.6.0", features = ["derive"] }
chrono = { workspace = true }
itertools = { workspace = true }
hex = "0.4.3"
project-root = "0.2.2"
serde = { workspace = true, features = ["derive"] }
serde-xml-rs = "0.8.2"
sha2 = "0.10.9"
xml = "1.2.1"
toml = "1.1.3"
serde_json = "1.0.151"
reqwest = { version = "0.13.4", features = ["blocking"] }
