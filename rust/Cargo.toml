[package]
name = "budgietlib"
description = "Bundled library for the native apps to call on"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
boltffi = "0.26.1"
chrono = { workspace = true }
itertools = { workspace = true }
regex = "1.12.4"
rust_decimal = "1.42.1"
rusty-money = "=0.5.0"
serde = "1.0.228"
thiserror = "2.0.18"
unicode-segmentation = "1.13.3"
